version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'husky']
      angular:
        patterns: ['@angular/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
