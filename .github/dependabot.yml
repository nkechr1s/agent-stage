version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', '@typescript-eslint/*', 'typescript', 'husky']
      angular:
        patterns: ['@angular/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
