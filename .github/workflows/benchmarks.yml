name: Benchmarks and soak
on:
  schedule:
    - cron: '43 5 * * 0'
  workflow_dispatch:
permissions:
  contents: read
env:
  HUSKY: '0'
jobs:
  measurements:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.1'
          cache: npm
      - run: npm install --global npm@11.13.0
      - run: npm ci
      - run: npm run build
      - run: mkdir -p artifacts
      - run: npm run benchmark
        env:
          BENCHMARK_RESULTS: artifacts/runtime.json
      - run: npm run benchmark:hardening
        env:
          HARDENING_RESULTS: artifacts/hardening.json
      - run: npm run soak
        env:
          SOAK_RESULTS: artifacts/soak.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: raw-benchmarks-${{ github.sha }}
          path: |
            artifacts/*.json
          if-no-files-found: warn
