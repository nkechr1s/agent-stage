name: Scheduled compatibility
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
env:
  HUSKY: '0'
jobs:
  framework:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [react18, react19, vue, angular20, angular21]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.1'
          cache: npm
      - run: npm install --global npm@11.13.0
      - run: npm ci
      - run: npm run check:frameworks -- ${{ matrix.framework }}
        env:
          FRAMEWORK_RESULTS: framework-results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: framework-${{ matrix.framework }}
          path: framework-results.json
          if-no-files-found: warn
