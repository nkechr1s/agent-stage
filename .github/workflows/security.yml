name: Dependency security
on:
  pull_request:
  push:
    branches: [main, master, develop]
  schedule:
    - cron: '11 4 * * 2'
  workflow_dispatch:
permissions:
  contents: read
env:
  HUSKY: '0'
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.1'
          cache: npm
      - run: npm install --global npm@11.13.0
      - run: npm ci --ignore-scripts
      - name: Root audit and complete JSON report
        if: always()
        run: node scripts/audit-compatibility.mjs --root
      - name: Independent supported fixture audits
        if: always()
        run: node scripts/audit-compatibility.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: root-and-compatibility-advisories
          path: |
            artifacts/root-audit.json
            artifacts/compatibility-audit.json
          if-no-files-found: warn
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
